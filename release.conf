# shellcheck shell=bash disable=SC2034 # release.sh reads these values after sourcing the file
# Release configuration of tn-p2p-allow-sync, read by release/release.sh, the shared release
# script of the tn-release-signing submodule at release/. Started from that repository's
# examples/cargo.release.conf; its docs/signing.md describes every key and hook.
#
# Every step runs from the repository root as ./release/release.sh <step> <TAG>, or through
# the release-* targets of the Makefile. release.sh sources this file before anything else,
# so it is bash 3.2: no associative arrays, mapfile, ${x,,}, sed -i or GNU date. build and
# publish refuse a copy that differs from the one on MAIN_REF.

# ---------------------------------------------------------------------------------------------
# Values

# The tarball is PROJECT-TAG-TRIPLE.tar.gz with the directory PROJECT-TAG-TRIPLE/ inside.
PROJECT=tn-p2p-allow-sync
DEFAULT_REPO=Telcoin-Association/tn-p2p-allow-sync

# vX.Y.Z finals and vX.Y.Z-rcN release candidates, one channel, no cargo features.
TAG_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$'

# One static musl program, then the files the tarball takes from the root of the tag's tree.
TRIPLE=x86_64-unknown-linux-musl
TARBALL_FILES='tn-p2p-allow-sync LICENSE-APACHE LICENSE-MIT NOTICE'

# prep sets the [package] version of Cargo.toml and writes each release's section after the
# ANCHOR line of CHANGELOG.md; the tag checks compare both with the tag.
VERSION_FILE=Cargo.toml
CHANGELOG_FILE=CHANGELOG.md
ANCHOR='<!-- ANCHOR: releases -->'

MAIN_REF=refs/remotes/origin/main
ARTIFACT_ROOT=target/release-artifacts
# Never below the "Signatures required" line of release/KEYS.md at the commit main records for
# release/, which states the threshold once for every project; release.sh enforces both.
MIN_SIGNATURES=1
# The maintainer keys and release.sh are read from the submodule commit that MAIN_REF records
# for release/, never from the checkout.
KEYS_PATH=release/keys
SELF_REPO_PATH=release

# The image etc/Dockerfile builds in, pinned by the digest of its multi-platform index. Its
# host toolchain is rustc 1.94.1 for x86_64-unknown-linux-musl, with gcc and musl-dev, so the
# build downloads no toolchain and installs no package. A tag is built and rebuilt in the
# image its own copy of this line names, so keep the line in exactly this form. To move it,
# change the digest here, RUSTUP_TOOLCHAIN in etc/Dockerfile and rust-toolchain.toml together:
#   docker buildx imagetools inspect rust:<version>-alpine --format '{{json .Manifest.Digest}}'
#   docker run --rm <image> sh -c 'rustc --version && gcc --version && ls /usr/lib/libc.a'
# rust:1.94-alpine, index digest as of 2026-11-05 (alpine 3.23.4, gcc 15.2.0)
BUILD_IMAGE='rust:1.94-alpine@sha256:77237dd363a0b127bb5ef532c2d64c0deb380b738e43a9c4bdac73398d6d0a08'

# ---------------------------------------------------------------------------------------------
# Hooks. hook_parse_extras, hook_extra_sums, hook_notes_sections and hook_publish_alias keep
# release.sh's empty defaults: no channel, no repository files in SHA256SUMS and no image to
# publish.

# The form of BUILD_IMAGE: a repository and tag, then the digest that alone decides the image.
TN_IMAGE_RE='^[a-z0-9][a-z0-9._/-]*(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$'

# The check runs that must have concluded success on the commit of a tag, one name per line,
# each matched exactly: the required checks of main (.github/ACTIONS.md).
TN_REQUIRED_CHECKS='fmt
clippy
test
coverage
deny
audit
release-dry-run
nft-real (ubuntu-24.04)
nft-real (ubuntu-22.04)
nft-real (debian:13)'

# The release workflow's run on the push of a tag uploads the artifact rebuild-TAG, which holds
# TN_REBUILD_FILE as etc/ci-rebuild.sh writes it: one line in sha256sum's format, the sha256 of
# the program it built from the tag, two spaces and PROJECT.
TN_REBUILD_WORKFLOW=release.yaml
TN_REBUILD_FILE=program.sha256

# The files of a tree that can set the panic strategy of its release build: the profiles of
# Cargo.toml, cargo's configuration, and the build's environment in etc/Dockerfile.
TN_PANIC_FILES='Cargo.toml .cargo/config.toml .cargo/config etc/Dockerfile'

# prep: the new CHANGELOG section, from the commits since the previous final release, with
# the git-cliff image release.sh pins and cliff.toml.
hook_changelog() { cliff_section "$1"; }

# check-tag, and with it tag (before it creates the tag), build, sign, verify and publish, for
# commit $1, with $2 always, or if-available in tag and sign: the build of that commit keeps the
# panic strategy unwind, and the required checks passed on it.
hook_check_tag_extra() {
    tn_check_unwind "$1"
    tn_check_ci_green "$1" "$2"
}

# build: two builds from scratch must give the same program before it is packed with the
# license files of the tag; a difference means the build is not reproducible, and nothing is
# uploaded.
hook_build() {
    local rd=$1 first second
    tn_build_program "$WORK/build1" "$BUILD_WT"
    tn_build_program "$WORK/build2" "$BUILD_WT"
    first=$(sha256_hex "$WORK/build1/$PROJECT") || exit
    second=$(sha256_hex "$WORK/build2/$PROJECT") || exit
    info "build 1 of $TAG: $PROJECT sha256 $first"
    info "build 2 of $TAG: $PROJECT sha256 $second"
    [ "$first" = "$second" ] ||
        die 1 "two builds of $TAG gave different programs ($first, $second); the build is not reproducible, so nothing was uploaded"
    pack_tarball "$rd" "$WORK/build1/$PROJECT"
}

# sign and verify, which build and publish run too: the program in the tarball is static and
# prints the five --version lines of this release, and while the release is a draft it is the
# program the release workflow's rebuild job built from the tag. With TN_P2P_ALLOW_REBUILD=1
# it is also rebuilt here from the tag and must be the same file; the release-verify target and
# the release workflow's verify-release job set it, and sign takes it only when asked, since
# an amd64 build under emulation on a Mac is slow. The build step's own check skips both
# rebuilds: hook_build has just built the program twice.
hook_check_release_files() {
    local prog="$1/x/$PROJECT-$TAG-$TRIPLE/$PROJECT"
    tn_check_version "$prog"
    tn_check_ci_rebuild "$prog"
    if [ "${TN_P2P_ALLOW_REBUILD:-}" = 1 ] && [ -z "$BUILD_WT" ]; then tn_rebuild "$prog"; fi
}

# ---------------------------------------------------------------------------------------------
# Helpers of the hooks above; the tn_ prefix keeps them apart from release.sh's own names.

# tn_build_program DEST TREE: one build of the program from TREE, a pristine tree of the tag,
# with TREE's etc/Dockerfile in the image TREE's release.conf pins, without the build cache;
# the program lands in DEST. The commit reaches the program as TN_P2P_ALLOW_GIT_SHA, which it
# reads with option_env!, so the build needs no git. buildx exports the last stage to DEST
# and pushes or loads no image.
tn_build_program() {
    local dest=$1 tree=$2 image
    image=$(tn_tree_image "$tree") || exit
    need docker
    require_docker
    set -- --platform linux/amd64 --pull --no-cache -f "$tree/etc/Dockerfile" --target out \
        --build-arg "BUILD_IMAGE=$image" --build-arg "GIT_SHA=$COMMIT"
    if [ -n "${CARGO_BUILD_JOBS:-}" ]; then set -- "$@" --build-arg "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"; fi
    info "building $PROJECT for $TRIPLE at $COMMIT in $image"
    rm -rf "$dest"
    docker buildx build "$@" --provenance=false --sbom=false \
        --output "type=local,dest=$dest" "$tree" >&2 ||
        die 3 "docker buildx build failed; a failed download (base image, crates.io) is the usual cause, so run the step again, and report it if the output above shows a build error instead"
    [ -f "$dest/$PROJECT" ] || die 1 "the build of $TAG wrote no $PROJECT"
}

# tn_tree_image TREE: BUILD_IMAGE as the release.conf in TREE sets it, read as text and never
# sourced. A tag is rebuilt in the image it was released with, whatever main pins today. Its
# output is captured, so a failure exits explicitly.
tn_tree_image() {
    local image
    [ -f "$1/release.conf" ] || die 1 "the tree of $TAG has no release.conf"
    image=$(sed -n "s/^BUILD_IMAGE='\\(.*\\)'\$/\\1/p" "$1/release.conf") ||
        die 1 "cannot read release.conf in the tree of $TAG"
    [[ "$image" =~ $TN_IMAGE_RE ]] ||
        die 1 "release.conf at $TAG must set BUILD_IMAGE once, as BUILD_IMAGE='<image>@sha256:<digest>' on a line of its own"
    printf '%s\n' "$image"
}

# tn_pull_amd64 IMAGE: the linux/amd64 image of IMAGE's index, pulled with retries; exit 3 when
# the registry stays unavailable. release.sh's pull_image pulls the host's platform, arm64 on
# a Mac, and skips the pull when the image is present in any form; the check runs amd64.
tn_pull_amd64() {
    local attempt=1
    until docker pull --quiet --platform linux/amd64 "$1" >&2; do
        [ "$attempt" -lt 3 ] || die 3 "docker pull --platform linux/amd64 $1 failed after 3 attempts"
        attempt=$((attempt + 1))
        sleep 5
    done
}

# tn_bytes FILE OFFSET COUNT: the COUNT bytes of FILE from OFFSET as decimal numbers on one
# line, fewer where the file ends first. od -v, since od otherwise folds repeated lines to "*".
tn_bytes() { od -v -A n -t u1 -j "$2" -N "$3" "$1" | tr -s ' \n' '  '; }

# tn_le BYTE...: the unsigned little-endian integer of the decimal BYTEs, at most 8 of them.
tn_le() {
    local v=0 s=0 b
    for b in "$@"; do
        v=$((v + (b << s)))
        s=$((s + 8))
    done
    printf '%s\n' "$v"
}

# tn_check_static PROGRAM: PROGRAM is an x86-64 ELF64 program with no PT_INTERP program header,
# so it asks for no dynamic loader. The --version check runs it in BUILD_IMAGE, which has
# musl's loader, so a dynamically linked build would pass there and fail on a validator's
# host. The ELF header and the program headers are read with od, so the check needs no
# binutils, which a Mac lacks: e_phoff at 0x20 (8 bytes), e_phentsize at 0x36 and e_phnum at
# 0x38 (2 bytes each), little-endian, and p_type in the first 4 bytes of each program header.
tn_check_static() {
    local prog=$1 what="$PROJECT in $TARBALL" h t size phoff phent phnum i=0
    read -r -a h <<<"$(tn_bytes "$prog" 0 64)"
    # \177ELF, ELFCLASS64, ELFDATA2LSB, then e_machine EM_X86_64 (62) at 0x12
    if [ "${#h[@]}" != 64 ] || [ "${h[*]:0:6}" != '127 69 76 70 2 1' ] || [ "$(tn_le "${h[18]}" "${h[19]}")" != 62 ]; then
        die 1 "$what is not an x86-64 ELF64 program"
    fi
    # without the padding a Mac's wc puts before the number
    size=$(wc -c <"$prog" | tr -d ' ') || die 2 "cannot read the size of $prog"
    phoff=$(tn_le "${h[@]:32:8}")
    phent=$(tn_le "${h[54]}" "${h[55]}")
    phnum=$(tn_le "${h[56]}" "${h[57]}")
    if [ "$phent" != 56 ] || [ "$phnum" -lt 1 ] || [ "$phoff" -lt 64 ] || [ $((phoff + phnum * phent)) -gt "$size" ]; then
        die 1 "$what has no valid program header table (e_phoff $phoff, e_phentsize $phent, e_phnum $phnum, $size bytes)"
    fi
    while [ "$i" -lt "$phnum" ]; do
        read -r -a t <<<"$(tn_bytes "$prog" $((phoff + i * phent)) 4)"
        [ "${#t[@]}" = 4 ] || die 2 "cannot read program header $i of $prog"
        # PT_INTERP
        [ "$(tn_le "${t[@]}")" != 3 ] ||
            die 1 "$what has a PT_INTERP program header: it is linked dynamically and needs a loader that a validator's host may not have, so it is not the static program this release ships"
        i=$((i + 1))
    done
}

# tn_check_version PROGRAM: PROGRAM is static (tn_check_static) and PROGRAM --version prints
# exactly the five lines of this release: the version, the tag's commit and the triple, then a
# snapshot-versions list that holds 1 and config-version 1, the formats the deployment scripts
# accept. The program runs in BUILD_IMAGE, since it is a static Linux program and sign runs on
# a Mac, with no network, as an unprivileged user, and copied in on stdin so no host path has
# to be shared with Docker.
tn_check_version() {
    local prog=$1 out want got
    [[ "$BUILD_IMAGE" =~ $TN_IMAGE_RE ]] || die 2 "$CONF: BUILD_IMAGE must be pinned by digest, got '$BUILD_IMAGE'"
    tn_check_static "$prog"
    need docker
    require_docker
    tn_pull_amd64 "$BUILD_IMAGE"
    out=$(docker run --rm -i --network none --platform linux/amd64 --user 65534:65534 \
        --entrypoint /bin/sh "$BUILD_IMAGE" \
        -c 'cat >/tmp/program && chmod 0755 /tmp/program && exec /tmp/program --version' <"$prog") ||
        die 1 "$PROJECT --version from $TARBALL failed"
    want=$(printf '%s\n' "$PROJECT $VERSION" "commit $COMMIT" "target $TRIPLE")
    got=$(printf '%s\n' "$out" | sed -n '1,3p')
    [ "$got" = "$want" ] ||
        die 1 "$PROJECT --version from $TARBALL begins '$(printf '%s' "$got" | tr '\n' '|')'; expected '$(printf '%s' "$want" | tr '\n' '|')'"
    printf '%s\n' "$out" | awk '
        NR == 4 && $1 == "snapshot-versions" { for (i = 2; i <= NF; i++) { n = split($i, v, ","); for (j = 1; j <= n; j++) if (v[j] == "1") one = 1 } }
        NR == 5 && $0 == "config-version 1" { config = 1 }
        END { exit !(NR == 5 && one && config) }
    ' || die 1 "$PROJECT --version from $TARBALL must end with a snapshot-versions line that lists 1 and the line 'config-version 1', five lines in all; it printed '$(printf '%s' "$out" | tr '\n' '|')'"
    info "$TARBALL: $PROJECT $VERSION, commit $COMMIT, target $TRIPLE, $(printf '%s\n' "$out" | sed -n '4p'), $(printf '%s\n' "$out" | sed -n '5p')"
}

# tn_build_commit DEST: one build of the tree of COMMIT as git stores it, so that nothing of
# the checkout (an edit, an untracked or ignored file) reaches the build; the program lands in
# DEST. tn_rebuild and etc/ci-rebuild.sh build with it.
tn_build_commit() {
    local tree=$WORK/commit-tree
    rm -rf "$tree"
    mkdir -p "$tree"
    git archive --format=tar "$COMMIT" | tar -xf - -C "$tree" || die 2 "cannot extract $COMMIT for the build"
    tn_build_program "$1" "$tree"
}

# tn_rebuild PROGRAM: one more build from the tag's tree, as git stores it at COMMIT, must give
# PROGRAM byte for byte; otherwise the release was not built from its tag.
tn_rebuild() {
    local prog=$1 want have
    tn_build_commit "$WORK/rebuild"
    want=$(sha256_hex "$prog") || exit
    have=$(sha256_hex "$WORK/rebuild/$PROJECT") || exit
    [ "$want" = "$have" ] ||
        die 1 "a rebuild of $TAG from $COMMIT gave $PROJECT sha256 $have, but the release's $PROJECT has sha256 $want; it was not built from its tag"
    info "rebuilt $TAG from $COMMIT: the same $PROJECT, sha256 $have"
}

# tn_check_unwind COMMIT: the release build of COMMIT keeps the panic strategy unwind, so that a
# panic exits 101 and reads as a bug, as the deployment scripts expect. No line of a
# TN_PANIC_FILES file at COMMIT, "#" comments left out, names both panic and abort in any case:
# panic = "abort" in a profile, -C panic=abort in rustflags, CARGO_PROFILE_RELEASE_PANIC=abort.
tn_check_unwind() {
    local sha=$1 f text hit
    for f in $TN_PANIC_FILES; do
        git cat-file -e "$sha:$f" 2>/dev/null || continue
        text=$(git show "$sha:$f") || die 2 "cannot read $f at $sha"
        hit=$(printf '%s\n' "$text" | awk '{ sub(/#.*/, ""); l = tolower($0) } l ~ /panic/ && l ~ /abort/ { print NR ": " $0; exit }')
        [ -z "$hit" ] ||
            die 1 "$f at $sha sets the panic strategy to abort (line $hit); the release build keeps panic = \"unwind\", so that a panic exits 101 and reads as a bug"
    done
    info "$sha keeps panic = \"unwind\" in its release build"
}

# tn_check_ci_green COMMIT MODE: for each name of TN_REQUIRED_CHECKS, the newest check run on
# COMMIT concluded success. Branch protection alone does not ensure that for the commit a tag
# names: an admin merge passes it by, and a red run on the push to main gates nothing. A run
# concluded skipped or neutral is passed over, since it ran no check of the commit (a job
# skipped by its `if:` reports one), and a name with only such runs counts as having none.
# Only check runs of the GitHub Actions app count: GitHub matches a check by name alone, and
# any other GitHub App installed on the repository with checks: write can post a run of that name.
# A dry run makes no gh call, and MODE if-available (tag and sign) leaves the check to CI on a
# host without gh. A published release had it checked before it was published, and the list
# may have grown since, so verify does not ask again.
tn_check_ci_green() {
    local sha=$1 runs name got bad=
    if [ "$DRY_RUN" = 1 ]; then
        info "dry run: not checking the CI results of $sha"
        return 0
    fi
    if [ "$2" = if-available ] && ! command -v gh >/dev/null 2>&1; then
        info "gh is not installed: the CI results of $sha are left to check-tag in CI"
        return 0
    fi
    release_state
    if [ "$REL_EXISTS" = 1 ] && [ "$REL_DRAFT" = false ]; then
        info "release $TAG is published: not checking the CI results of $sha again"
        return 0
    fi
    runs=$(gh_run api "repos/$REPO/commits/$sha/check-runs?per_page=100" --paginate \
        --jq '.check_runs[] | select(.app.slug == "github-actions") | [.id, .name, .status, (.conclusion // "")] | @tsv') || exit
    while IFS= read -r name; do
        got=$(printf '%s\n' "$runs" | awk -F '\t' -v n="$name" '
            $2 != n { next }
            $4 == "skipped" || $4 == "neutral" { idle = 1; next }
            $1 + 0 > id { id = $1 + 0; got = ($4 != "" ? $4 : $3) }
            END { print (got != "" ? got : (idle ? "-" : "")) }')
        case "$got" in
            success) ;;
            '') bad="$bad, $name (no check run)" ;;
            -) bad="$bad, $name (no check run, only skipped or neutral ones)" ;;
            *) bad="$bad, $name ($got)" ;;
        esac
    done <<LIST
$TN_REQUIRED_CHECKS
LIST
    [ -z "$bad" ] ||
        die 1 "CI has not passed on $sha: ${bad#, }; the newest GitHub Actions check run of each name in TN_REQUIRED_CHECKS, skipped and neutral runs left out, must conclude success on the commit of a release tag"
    info "CI passed on $sha: $(printf '%s\n' "$TN_REQUIRED_CHECKS" | awk '{ printf "%s%s", (NR > 1 ? ", " : ""), $0 }')"
}

# tn_check_ci_rebuild PROGRAM: PROGRAM, the program of the draft, is the one the release
# workflow's rebuild job built from the tag on a GitHub runner, a host the build server does
# not control, and recorded in its artifact rebuild-TAG (etc/ci-rebuild.sh); otherwise the
# build server alone would decide what sign signs and publish publishes. The run is the newest
# run of TN_REBUILD_WORKFLOW on the push of TAG at COMMIT, and it must have succeeded. Its
# artifact is looked up before the download, so an expired or missing one is named as such
# rather than as a download that failed 3 times. A dry run makes no gh call. The build step's
# own verify skips the comparison, since the rebuild job may still be running and the server
# checking itself proves nothing, and so does a published release, which was compared before
# it was published and whose artifact expires.
tn_check_ci_rebuild() {
    local prog=$1 runs line id state conclusion expired dir want have re
    if [ "$DRY_RUN" = 1 ]; then
        info "dry run: not comparing $PROJECT with the CI rebuild of $TAG"
        return 0
    fi
    if [ -n "$BUILD_WT" ]; then
        info "build: sign, verify and publish compare $PROJECT with the CI rebuild of $TAG"
        return 0
    fi
    if [ "$REL_DRAFT" != true ]; then
        info "release $TAG is published: not comparing $PROJECT with the CI rebuild of $TAG again"
        return 0
    fi
    runs=$(gh_run run list --repo "$REPO" --workflow "$TN_REBUILD_WORKFLOW" --commit "$COMMIT" --event push \
        --json databaseId,status,conclusion,headBranch \
        --jq '.[] | select(.headBranch == "'"$TAG"'") | "\(.databaseId) \(.status) \(.conclusion)"') || exit
    line=$(printf '%s\n' "$runs" | sed -n 1p)
    [ -n "$line" ] ||
        die 2 "GitHub has no run of $TN_REBUILD_WORKFLOW for the push of $TAG at $COMMIT: wait for the CI rebuild of $TAG, then run this step again"
    read -r id state conclusion <<RUN
$line
RUN
    [ "$state" = completed ] ||
        die 2 "run $id of $TN_REBUILD_WORKFLOW for $TAG is $state: wait for the CI rebuild of $TAG to finish, then run this step again"
    [ "$conclusion" = success ] ||
        die 1 "run $id of $TN_REBUILD_WORKFLOW for $TAG concluded $conclusion, so there is no CI rebuild of $TAG to compare $PROJECT with; see the run, and re-run it once its cause is fixed"
    # one line per artifact of that name, true or false; gh run download skips an expired one
    expired=$(gh_run api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" --paginate \
        --jq '.artifacts[] | select(.name == "rebuild-'"$TAG"'") | .expired') || exit
    case "$expired" in
        *false*) ;;
        '') die 1 "run $id of $TN_REBUILD_WORKFLOW for $TAG has no artifact rebuild-$TAG, so there is no CI rebuild of $TAG to compare $PROJECT with: re-run the release workflow's rebuild job of run $id, then run this step again" ;;
        *) die 1 "the artifact rebuild-$TAG of run $id of $TN_REBUILD_WORKFLOW has expired, so there is no CI rebuild of $TAG to compare $PROJECT with: re-run the release workflow's rebuild job of run $id, then run this step again" ;;
    esac
    dir=$WORK/ci-rebuild
    rm -rf "$dir"
    mkdir -p "$dir"
    gh_run run download "$id" --repo "$REPO" -n "rebuild-$TAG" -D "$dir" >&2
    line=
    if [ -f "$dir/$TN_REBUILD_FILE" ]; then line=$(cat "$dir/$TN_REBUILD_FILE") || die 2 "cannot read $TN_REBUILD_FILE"; fi
    re="^([0-9a-f]{64})  $PROJECT\$"
    [[ "$line" =~ $re ]] ||
        die 1 "the artifact rebuild-$TAG of run $id holds no $TN_REBUILD_FILE of the one line '<sha256>  $PROJECT'"
    want=${BASH_REMATCH[1]}
    have=$(sha256_hex "$prog") || exit
    [ "$have" = "$want" ] ||
        die 1 "the draft's $PROJECT has sha256 $have, but the CI rebuild of $TAG from $COMMIT (run $id of $TN_REBUILD_WORKFLOW) gave sha256 $want: the build server's program is not the one the tag builds, so do not sign or publish it"
    info "the CI rebuild of $TAG from $COMMIT (run $id of $TN_REBUILD_WORKFLOW) gave the same $PROJECT, sha256 $have"
}
