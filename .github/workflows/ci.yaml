# The gates of every pull request and every push to main: fmt, clippy, test, deny, audit,
# and a dry run of the release. deny and audit also run weekly on main, on their own.
#
# Each job runs one command, the same one a maintainer runs locally before pushing, so a
# red job reproduces with the command its last step names (.github/ACTIONS.md lists them).
# rust-toolchain.toml selects the toolchain for every cargo call, here and locally.
#
# Every action is pinned to a full commit SHA, with the release it stands for in a trailing
# comment on the same line. A tag can be repointed upstream, and the gate would then run new
# code with no change in this repository. The pin table and how a pin moves are in
# .github/ACTIONS.md, under "Action pins".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # deny and audit again every Monday on main, so an advisory published against a dependency
  # of the released program turns them red with no pull request open; every other job skips
  # this event. GitHub disables a schedule after 60 days without activity in the repository
  # (.github/ACTIONS.md says how to turn it back on).
  schedule:
    - cron: "23 5 * * 1"
  # every job, on the branch it is started on
  workflow_dispatch:

# A new push to a pull request cancels the run for its previous head, which nothing reads any
# more. Every other run is a group of its own: GitHub cancels a waiting run when a newer one
# joins its group, and every push to main has to report, so a push, the schedule and a
# dispatch never wait for, cancel or displace another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# nothing here writes; each job asks for read access to the repository and no more
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # warnings fail the build in CI, not through #![deny(warnings)] in the source
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Test
        run: cargo test --locked

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # the version comes from the pinned commit's manifest with its sha256; `fallback: none`
      # fails the step instead of fetching an unchecked build when the manifest lacks it
      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: cargo deny
        run: cargo deny check

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # same pin and the same fallback rule as cargo-deny above
      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: cargo audit
        run: cargo audit

  # every step of release/release.sh on a copy of this tree, in a dry run with a throwaway
  # key, and with the real build: two builds and the rebuild of verify must give one program.
  # It needs no toolchain on the runner (the build runs in release.conf's BUILD_IMAGE) and
  # no token beyond reading the repository and the release/ submodule.
  release-dry-run:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Release dry run
        run: bash etc/tests/release_dry_run.sh
