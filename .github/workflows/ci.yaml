# The gates of every pull request and every push to main: fmt, clippy, test, coverage, deny,
# audit, and a dry run of the release. The weekly deny and audit on main are scheduled.yaml's
# deny-weekly and audit-weekly.
#
# Every job runs on every event of this workflow, with no job-level `if:`. A job skipped by
# its `if:` leaves a check run concluded `skipped` on the commit, under the name of a required
# check, and the newest run of that name is what branch protection reads. The release gate of
# release.conf (tn_check_ci_green) reads the jobs of this workflow's push-to-main run instead,
# and counts a skipped job as missing.
#
# Each job runs one command, the same one a maintainer runs locally before pushing, so a
# red job reproduces with the command its last step names (.github/ACTIONS.md lists them).
# rust-toolchain.toml selects the toolchain for every cargo call, here and locally.
#
# Every action is pinned to a full commit SHA, with the release it stands for in a trailing
# comment on the same line. A tag can be repointed upstream, and the gate would then run new
# code with no change in this repository. The pin table and how a pin moves are in
# .github/ACTIONS.md, under "Action pins".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # every job, on the branch it is started on
  workflow_dispatch:

# A new push to a pull request cancels the run for its previous head, which nothing reads any
# more. Every other run is a group of its own: GitHub cancels a waiting run when a newer one
# joins its group, and every push to main has to report, so a push and a dispatch never wait
# for, cancel or displace another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# nothing here writes; each job asks for read access to the repository and no more
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # warnings fail the build in CI, not through #![deny(warnings)] in the source
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Test
        run: cargo test --locked

  # the same tests, instrumented: the total line coverage may not fall more than 0.5 points
  # below etc/coverage-baseline (etc/coverage-gate.sh). The JSON summary and an lcov report
  # are kept as the artifact `coverage`, whether the gate passed or not.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml lists llvm-tools-preview, which cargo llvm-cov needs
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # same pin and the same fallback rule as cargo-deny below
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Coverage
        id: coverage
        run: cargo llvm-cov --locked --summary-only --json --output-path target/coverage.json

      # from the profiles of the run above; builds and runs nothing
      - name: lcov report
        run: cargo llvm-cov report --locked --lcov --output-path target/lcov.info

      - name: Coverage gate
        run: bash etc/coverage-gate.sh target/coverage.json etc/coverage-baseline

      - name: Upload the coverage reports
        if: always() && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            target/coverage.json
            target/lcov.info

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # the version comes from the pinned commit's manifest with its sha256; `fallback: none`
      # fails the step instead of fetching an unchecked build when the manifest lacks it
      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: cargo deny
        run: cargo deny check

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # same pin and the same fallback rule as cargo-deny above
      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: cargo audit
        run: cargo audit

  # every step of release/release.sh on a copy of this tree, in a dry run with a throwaway
  # key, and with the real build: two builds and the rebuild of verify must give one program.
  # It needs no toolchain on the runner (the build runs in release.conf's BUILD_IMAGE) and
  # no token beyond reading the repository and the release/ submodule.
  release-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Release dry run
        run: bash etc/tests/release_dry_run.sh
